name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "Releasing $version"

  build:
    name: ${{ matrix.name }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (gnu)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: Linux x86_64 (musl, static)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            setup: musl

          - name: Linux aarch64 (gnu, cross)
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            setup: aarch64

          - name: macOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz

          - name: macOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

          - name: Windows x86_64 (MSVC)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install aarch64 cross linker
        if: matrix.setup == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="buk-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/buk" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="buk-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/buk.exe" "$stage/"
          cp LICENSE README.md "$stage/"
          7z a "${stage}.zip" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buk-${{ matrix.target }}
          path: |
            buk-*.tar.gz
            buk-*.zip
          if-no-files-found: error

  packages:
    name: Linux packages (deb, rpm)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download static musl build
        uses: actions/download-artifact@v4
        with:
          name: buk-x86_64-unknown-linux-musl
          path: .

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
          NFPM_SHA256: "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
        run: |
          curl -sSfL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
          nfpm --version

      - name: Stage files
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p staging
          tar -xzf "buk-${version}-x86_64-unknown-linux-musl.tar.gz"
          install -m755 "buk-${version}-x86_64-unknown-linux-musl/buk" staging/buk
          cp LICENSE README.md staging/

      - name: Build .deb and .rpm
        run: |
          version="${GITHUB_REF_NAME#v}"
          export BUK_VERSION="$version"
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "buk_${version}_amd64.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "buk-${version}-1.x86_64.rpm"
          ls -l buk_*.deb buk-*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: buk-linux-packages
          path: |
            buk_*.deb
            buk-*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(buk-*.tar.gz buk-*.zip buk_*.deb buk-*.rpm)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release archives found" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$tag"
          fi
